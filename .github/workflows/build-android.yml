# يبني ملف APK (للتجربة والتوزيع المباشر) و AAB (للرفع على Google Play)
# كل اللي محتاجه: الأسرار (Secrets) في إعدادات المستودع — راجع docs/SETUP.md
name: Build Android

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-android.yml']
  workflow_run:
    workflows: ['Setup & deploy Firebase']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
          test -f android/app/google-services.json || { echo "::error::google-services.json missing"; exit 1; }

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
          elif [ ! -f android/key.properties ]; then
            echo "::warning::No signing key — building with debug key"
          fi

      - run: flutter pub get

      - name: Build APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: flutter build apk --release

      - name: Build split APKs (smaller, per phone type)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/universal.apk
          flutter build apk --release --split-per-abi
          cp /tmp/universal.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Build App Bundle (Google Play)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: mehtag-sanaye-android
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish APK (GitHub Release + apk branch)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^version:' app/pubspec.yaml | awk '{print $2}')
          TAG="v${VER}-build${{ github.run_number }}"
          cp app/build/app/outputs/flutter-apk/app-release.apk mehtag-sanaye.apk
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk mehtag-sanaye-arm64.apk
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk mehtag-sanaye-armv7.apk
          gh release create "$TAG" mehtag-sanaye.apk mehtag-sanaye-arm64.apk mehtag-sanaye-armv7.apk app/build/app/outputs/bundle/release/app-release.aab \
            --title "محتاج صنايعي $TAG" --notes "mehtag-sanaye-arm64.apk: لمعظم الموبايلات الحديثة (أصغر) — mehtag-sanaye.apk: يشتغل على كل الأجهزة — AAB: لـ Google Play" --latest
          git config user.name "github-actions"; git config user.email "actions@github.com"
          mkdir -p /tmp/apkb && cp mehtag-sanaye*.apk /tmp/apkb/
          git checkout --orphan apk-tmp && git rm -rfq . && cp /tmp/apkb/*.apk .
          git add *.apk && git commit -qm "APK $TAG"
          git push -f origin apk-tmp:apk
