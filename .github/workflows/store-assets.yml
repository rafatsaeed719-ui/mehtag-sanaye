# صور المتجر لـ Google Play (بيانات تجريبية بتتعمل وتتمسح في نفس التشغيل) — النتيجة على فرع store
name: Store screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          npm i --no-audit --no-fund --prefix webtest playwright@1.48.2 firebase-admin@12 > /dev/null 2>&1
          npx --prefix webtest playwright install --with-deps chromium > /dev/null 2>&1
          sudo apt-get install -y fonts-noto-color-emoji > /dev/null 2>&1 || true
          cd server-tools && npm install --no-audit --no-fund > /dev/null 2>&1
      - name: Prepare
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          P=$(openssl rand -hex 12)Aa1!
          echo "::add-mask::$P"
          echo "TEST_PASS=$P" >> "$GITHUB_ENV"
          D=$(openssl rand -hex 12)Dd1!
          echo "::add-mask::$D"
          echo "DEMO_ADMIN_PASSWORD=$D" >> "$GITHUB_ENV"
      - run: node webtest/accounts.js && (cd server-tools && SHOT=1 node scripts/seed-demo.js)
      - name: Screenshots
        run: node webtest/store.mjs || true
      - name: Clean up demo data
        if: always()
        run: |
          node webtest/accounts.js remove || true
          (cd server-tools && node scripts/seed-demo.js --remove) || true
      - name: Publish
        if: always()
        run: |
          cd webtest/store 2>/dev/null || exit 0
          git init -q && git checkout -q -b store
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "store assets $(date -u +%F_%T)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" store
