# يختبر قواعد الأمان على محاكي Firestore مع كل تعديل (من غير أي أسرار)
name: Test security rules

on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'server-tools/**', '.github/workflows/test-rules.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Logic tests
        run: npm test
      - name: Security rules tests (Firestore emulator)
        run: npx firebase emulators:exec --config ../firebase.json --project demo-mehtag --only firestore "node --test test/rules.test.mjs"
