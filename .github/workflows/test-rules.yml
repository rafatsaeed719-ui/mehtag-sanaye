# يختبر قواعد الأمان على محاكي Firestore مع كل تعديل (من غير أي أسرار)
name: Test security rules

on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'server-tools/**', '.github/workflows/test-rules.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Logic tests
        run: npm test
      - name: Security rules tests (Firestore emulator)
        run: |
          set +e
          npx firebase emulators:exec --config ../firebase.json --project demo-mehtag --only firestore "node --test --test-reporter=tap test/rules.test.mjs" > rules-out.txt 2>&1
          code=$?
          cat rules-out.txt
          if [ $code -ne 0 ]; then
            # الأخطاء كـ annotations عشان تتقري من الـAPI
            grep -E "^not ok|^# (pass|fail)" rules-out.txt | head -20 | while read -r l; do echo "::error::$l"; done
            grep -nE "error:|Error:|expected|PERMISSION|message:" rules-out.txt | head -30 | sed 's/^/::error::/' | cut -c1-900
          fi
          exit $code
