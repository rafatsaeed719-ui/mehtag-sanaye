<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{font-family:Cairo,sans-serif;background:linear-gradient(135deg,#12355B 0%,#0B2440 100%);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 70px;box-sizing:border-box;position:relative}
.glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(247,147,30,.28),transparent 65%);left:-60px;top:-10px}
.txt{z-index:1;max-width:560px}
h1{font-size:68px;font-weight:900;margin:0;line-height:1.15}
h1 span{color:#F7931E}
p{font-size:28px;font-weight:600;margin:10px 0 22px;opacity:.92}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:30px;padding:6px 16px;font-size:20px;font-weight:600}
.logo{z-index:1;width:300px;height:300px;border-radius:50%;border:8px solid #F7931E;box-shadow:0 20px 50px rgba(0,0,0,.4);background:#fff;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
</style></head><body><div class="glow"></div>
<div class="txt"><h1>محتاج <span>صنايعي</span>؟</h1><p>إحنا نوصّلك لحد عندك! أقرب صنايعي موثوق بضغطة واحدة</p>
<div class="chips"><div class="chip">📍 الأقرب ليك</div><div class="chip">⭐ تقييمات حقيقية</div><div class="chip">🚨 طوارئ فورًا</div></div></div>
<div class="logo"><img src="LOGO"></div></body></html>
