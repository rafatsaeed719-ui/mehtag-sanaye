name: mehtag_sanaye
description: "محتاج صنايعي — Marketplace يربط العملاء بالصنايعية القريبين في مصر"
publish_to: 'none'
version: 1.4.1+9

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # Maps & location
  flutter_map: 7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # UI & utilities
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
